
name: Build New Taipei Earthquake APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'newtaipei-earthquake-android-source.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q newtaipei-earthquake-android-source.zip -d appsrc

      - name: Build APK
        run: |
          gradle -p appsrc assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NewTaipei-Earthquake-APK
          path: appsrc/app/build/outputs/apk/debug/app-debug.apk

